[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coral-clf"
version = "0.1.0"
description = "SOTA Coral Image Classification and TagLab Mosaic Segmentation using ConvNextVIT and SAM3"
readme = "README.md"
authors = [
    { name = "Dat Nguyen", email = "nguyedat@mail.gvsu.edu" },
    { name = "Minh Tran", email = "tranmq@mail.gvsu.edu" },
    { name = "Denton Bobeldyk", email = "bobeldyd@gvsu.edu" },
    { name = "Jonathan P. Leidig", email = "leidijon@gvsu.edu" },
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=9.0.0",
    "scipy>=1.10.0",
    "scikit-image>=0.20.0",
    "opencv-python>=4.7.0",
    "matplotlib>=3.7.0",
    "json5>=0.9.14",
    "accelerate>=0.25.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
sam3 = [
    # SAM 3 or Segment Anything dependency (install according to your environment)
]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
]

[tool.setuptools.packages.find]
include = ["coral_clf*"]
